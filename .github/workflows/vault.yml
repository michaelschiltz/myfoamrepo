name: vault

on:
  push:
    branches: [master]
    paths-ignore:
      - 'graph/**'        # graph-only commits must not retrigger (prevents loops)
  pull_request:

permissions:
  contents: write         # allows the graph rebuild to commit back

jobs:
  validate-and-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate vault (schema, links, headings, tags)
        run: python3 scripts/validate_vault.py

      - name: Rebuild knowledge graph
        if: github.event_name == 'push'
        # graph.svg is deliberately not built here. Graphviz layout is
        # version-dependent, so a runner-rendered SVG and a locally-rendered
        # one differ by thousands of lines for an identical graph. Nothing in
        # the repo consumes the SVG — graph.html is the shareable artefact —
        # so it is gitignored and rendered on demand:
        #   dot -Tsvg graph/graph.dot -o /tmp/graph.svg
        run: python3 scripts/export_graph.py

      - name: Commit graph if it changed
        if: github.event_name == 'push'
        run: |
          git config user.name  "vault-bot"
          git config user.email "actions@users.noreply.github.com"
          git add graph/
          if git diff --cached --quiet; then
            echo "graph unchanged — nothing to commit"
          else
            git commit -m "CI: rebuild knowledge graph [skip ci]"
            git push
          fi
